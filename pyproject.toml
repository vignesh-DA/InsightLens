[project]
name = "nlp-cap"
version = "0.1.0"
description = "InsightLens: Intelligent Product Review Analysis System"
readme = "README.md"
authors = [
    { name = "vignesh-DA", email = "gogulavignesh9.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.4.0",
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
